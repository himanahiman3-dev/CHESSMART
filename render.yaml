# Render Blueprint matching the existing CHESSMART Docker Web Service.
# Review the Blueprint plan before the first sync: the live service may not yet
# be managed by this Blueprint, and an unreviewed sync could create a duplicate.
services:
  - type: web
    name: CHESSMART
    runtime: docker
    plan: free
    region: virginia
    dockerContext: .
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    autoDeployTrigger: commit
