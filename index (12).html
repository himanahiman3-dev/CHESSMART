<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Анализ шахматной партии</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.js"></script>
<style>
  :root{--bg:#262522;--panel:#312e2b;--panel2:#3d3a37;--green:#81b64c}
  body{background:var(--bg);color:#fff;font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
  .btn{background:var(--green);color:#fff;font-weight:700;padding:.75rem 1.4rem;border-radius:.5rem;box-shadow:0 4px 0 #5d8a35}
  .btn:active{transform:translateY(3px);box-shadow:0 1px 0 #5d8a35}
  .btn2{background:var(--panel2);color:#e8e8e8;padding:.55rem .9rem;border-radius:.5rem}
  .btn2:hover{background:#4a4743} button:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--green);outline-offset:2px}
  .boardcol{width:min(100%,calc(100vh - 80px),720px)}
  #board{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));grid-template-rows:repeat(8,minmax(0,1fr));aspect-ratio:1;border-radius:4px;position:relative}
  .sq{position:relative;min-width:0;min-height:0;aspect-ratio:1;display:flex;align-items:center;justify-content:center;user-select:none}
  .sq.l{background:#f0d9b5}.sq.d{background:#b58863}
  .sq.hl::before{content:"";position:absolute;inset:0;background:rgba(255,235,60,.42)}
  .pc{position:relative;width:100%;height:100%;object-fit:contain;z-index:2;pointer-events:none}
  .pcg{position:relative;line-height:1;font-size:calc(var(--s)*.82);z-index:2}
  .pcg.w{color:#fff;-webkit-text-stroke:1.5px #222;paint-order:stroke fill}
  .pcg.b{color:#1d1d1d;-webkit-text-stroke:1px #000}
  #arrows{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:6}
  .co{position:absolute;font-size:calc(var(--s)*.17);font-weight:700;z-index:1;opacity:.85}
  .l .co{color:#b58863}.d .co{color:#f0d9b5}
  .bd{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;color:#fff;font-weight:800;font-style:normal;flex:none;line-height:1}
  .bd.sm{width:20px;height:20px;font-size:10px}.bd.md{width:28px;height:28px;font-size:13px}
  .bd.onb{position:absolute;top:-5%;right:-5%;width:calc(var(--s)*.42);height:calc(var(--s)*.42);font-size:calc(var(--s)*.2);z-index:5;box-shadow:0 1px 4px #0009}
  #bar{width:26px;background:#403d39;border-radius:4px;position:relative;overflow:hidden;flex:none}
  #barW{position:absolute;left:0;right:0;background:#f0f0f0;transition:height .35s}
  #barT{position:absolute;left:0;right:0;text-align:center;font-size:10px;font-weight:800;padding:3px 0}
  .mrow{display:grid;grid-template-columns:34px 1fr 1fr;align-items:center}
  .mn{color:#8b8987;font-size:.8rem;padding-left:6px}
  .mv{display:flex;align-items:center;gap:6px;padding:5px 8px;border-radius:5px;font-weight:600;text-align:left}
  .mv:hover{background:var(--panel2)}.mv.on{background:#5a5755}
  #moves{max-height:300px;overflow:auto}
  #board{touch-action:none}
  #comment{height:240px;overflow-y:auto}
  .sq.dot::after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(0,0,0,.22);z-index:3}
  .sq.cap::after{content:"";position:absolute;inset:3%;border-radius:50%;border:calc(var(--s)*.08) solid rgba(0,0,0,.22);z-index:3}
  .dim{opacity:.4;pointer-events:none}
  @media(max-width:1023px){#moves{max-height:220px}}
</style>
</head>
<body>

<section id="landing" class="max-w-3xl mx-auto p-5 pt-10 md:pt-16">
  <h1 class="text-3xl md:text-4xl font-extrabold">Разбор партии</h1>
  <p class="text-neutral-400 mt-2">Вставьте PGN. Stockfish проверит каждую позицию прямо в браузере, без сервера.</p>
  <textarea id="pgn" rows="12" spellcheck="false" placeholder="[Event &quot;?&quot;]&#10;&#10;1. e4 e5 2. Nf3 Nc6 ..." class="w-full mt-5 p-4 rounded-lg bg-[#1f1e1b] border border-[#4a4743] font-mono text-sm focus:border-[#81b64c] outline-none"></textarea>
  <div class="flex flex-wrap items-center gap-3 mt-4">
    <button id="go" class="btn">Анализировать партию</button>
    <button id="sample" class="btn2">Вставить пример</button>
    <label class="text-neutral-400 text-sm ml-auto">Движок
      <select id="engine" class="ml-2 bg-[#3d3a37] text-white rounded px-2 py-1"><option value="lite" selected>Stockfish 19 lite (≈2 МБ, быстро)</option><option value="full">Stockfish 19 полный (≈99 МБ, максимум силы)</option></select>
    </label>
    <label class="text-neutral-400 text-sm">Режим
      <select id="mode" class="ml-2 bg-[#3d3a37] text-white rounded px-2 py-1">
        <option value="fast" selected>Быстрый (≈10 с)</option>
        <option value="standard">Стандарт (глубина 20)</option>
        <option value="deep">Глубокий (глубина 26)</option>
      </select>
    </label>
    <label class="text-neutral-400 text-sm">Время на позицию
      <select id="tlim" class="ml-2 bg-[#3d3a37] text-white rounded px-2 py-1 dim"><option value="0">без лимита</option><option value="2">2 с</option><option value="5">5 с</option><option value="10">10 с</option><option value="30">30 с</option><option value="60">60 с</option></select>
    </label>
  </div>
  <div id="err" class="hidden mt-4 p-3 rounded-lg bg-[#5a2523] text-[#ffd2d0] text-sm"></div>
</section>

<section id="app" class="hidden p-3 lg:p-6 max-w-[1180px] mx-auto">
  <div class="flex flex-col lg:flex-row gap-5 items-start justify-center">
    <div class="boardcol flex gap-2">
      <div id="bar"><div id="barW"></div><span id="barT"></span></div>
      <div id="board" class="flex-1 min-w-0"></div>
    </div>
    <aside class="w-full lg:w-[380px] flex flex-col gap-3">
      <div class="bg-[#312e2b] rounded-lg p-4">
        <div id="names" class="font-bold truncate"></div>
        <div id="status" class="text-sm text-neutral-400 mt-1 truncate"></div>
        <div class="h-1.5 bg-[#4a4743] rounded mt-2 overflow-hidden"><div id="prog" class="h-full bg-[#81b64c] transition-all" style="width:0"></div></div>
      </div>
      <div id="comment" class="bg-[#312e2b] rounded-lg p-4"></div>
      <div class="bg-[#312e2b] rounded-lg p-2"><div id="moves"></div></div>
      <div class="flex gap-2">
        <button class="btn2 flex-1" data-nav="start" aria-label="В начало">⏮</button>
        <button class="btn2 flex-1" data-nav="prev" aria-label="Назад">◀</button>
        <button class="btn2 flex-1" data-nav="next" aria-label="Вперёд">▶</button>
        <button class="btn2 flex-1" data-nav="end" aria-label="В конец">⏭</button>
        <button class="btn2" id="flip" aria-label="Перевернуть доску">⇅</button>
      </div>
      <div class="flex items-center gap-2"><button class="btn2" id="play">▶ Авто</button>
        <select id="speed" class="bg-[#3d3a37] text-white rounded px-2 py-2"><option value="600">быстро</option><option value="1200" selected>средне</option><option value="2500">медленно</option></select>
        <label class="ml-auto flex items-center gap-2 text-sm text-neutral-300"><input type="checkbox" id="snd" checked class="accent-[#81b64c]">Звуки</label></div>
      <div class="text-xs text-neutral-500 px-1">Двигайте фигуры мышью — это свободный анализ. Правая кнопка мыши рисует стрелки и круги (Shift — красные, Ctrl — синие).</div>
      <label class="flex items-start gap-2 text-sm text-neutral-300 px-1"><input type="checkbox" id="arr" checked class="mt-1 accent-[#81b64c]">
        <span>Стрелки: <b style="color:#5aa93c">зелёная</b> — лучший ход, <b style="color:#d6382f">красная</b> — угроза соперника</span></label>
      <label class="flex items-center gap-2 text-sm text-neutral-300 px-1"><input type="checkbox" id="voice" class="accent-[#81b64c]"><span>Озвучка важных ходов (блестящие, ошибки, зевки)</span></label>
      <div id="summary" class="bg-[#312e2b] rounded-lg p-3 text-sm"></div>
      <button id="back" class="btn2">Новая партия</button>
    </aside>
  </div>
</section>

<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const SF_URLS=['https://cdnjs.cloudflare.com/ajax/libs/stockfish.js/10.0.2/stockfish.js','https://cdn.jsdelivr.net/npm/stockfish.js@10.0.2/stockfish.js'];
const GLYPH={k:'♚',q:'♛',r:'♜',b:'♝',n:'♞',p:'♟'};
const VAL={p:1,n:3,b:3,r:5,q:9,k:0};
const B={
  book:{c:'#a88865',s:'📖',t:'Теория'},

/* ---------- Кэш движка в браузере (Cache API) ---------- */
const ENGINE_CACHE = 'stockfish-engines-v1';
const canCache = typeof caches !== 'undefined';

async function readWithProgress(resp, onProgress) {
  const total = +resp.headers.get('Content-Length') || 0;
  if (!resp.body || !onProgress) return await resp.arrayBuffer();
  const reader = resp.body.getReader();
  const chunks = [];
  let received = 0;
  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    chunks.push(value);
    received += value.length;
    onProgress(received, total);
  }
  const out = new Uint8Array(received);
  let off = 0;
  for (const c of chunks) { out.set(c, off); off += c.length; }
  return out.buffer;
}

async function getCachedFile(url, onProgress) {
  if (canCache) {
    try {
      const cache = await caches.open(ENGINE_CACHE);
      const hit = await cache.match(url);
      if (hit) {
        if (onProgress) onProgress(-1, -1);      // сигнал «из кэша»
        return await hit.arrayBuffer();
      }
    } catch (e) { console.warn('Cache read failed:', e); }
  }
  const resp = await fetch(url);
  if (!resp.ok) throw new Error('HTTP ' + resp.status + ' для ' + url);
  const buf = await readWithProgress(resp, onProgress);
  if (canCache) {
    try {
      const cache = await caches.open(ENGINE_CACHE);
      await cache.put(url, new Response(buf, {
        headers: { 'Content-Type': 'application/octet-stream' }
      }));
    } catch (e) { console.warn('Cache write failed:', e); }
  }
  return buf;
}

function reportEngineProgress(label, rec, tot) {
  const st = document.getElementById('status');
  if (!st) return;
  if (rec < 0) { st.textContent = label + ' — из кэша'; return; }
  if (tot > 0) {
    const pct = Math.round(rec / tot * 100);
    st.textContent = label + ': ' + pct + '% (' +
      (rec / 1048576).toFixed(1) + ' / ' + (tot / 1048576).toFixed(1) + ' МБ)';
  } else {
    st.textContent = label + ': ' + (rec / 1048576).toFixed(1) + ' МБ';
  }
}

class Engine{
  async init(kind){
    this.kind=kind||'lite';
    const tries=[
      ...(this.kind==='full'?[['Stockfish 19 NNUE (WASM, полная)',()=>this.initWorker([SF19F+'.js'],SF19F+'.wasm',300000)]]:[]),
      ['Stockfish 19 NNUE (WASM, lite)',()=>this.initWorker([SF19+'.js'],SF19+'.wasm',15000)],
      ['Stockfish 16 NNUE (WASM)',()=>this.initWorker([SF16+'.js'],SF16+'.wasm',120000)],
      ['Stockfish.js 10',()=>this.initWorker(SF_URLS,null,10000)],
      ['Stockfish.js 10 (основной поток)',()=>this.initMain()]];
    let last;
    for(const[n,f]of tries){
      try{this.reset();await f();this.name=n;this.modern=!n.includes('Stockfish.js 10');break}
      catch(e){last=e;console.warn(n,'недоступен:',e.message)}
    }
    if(!this.name)throw last;

    // === UCI-настройки в духе Chess.com ===
    this.send('setoption name Hash value 64');       // 64 МБ TT
    this.send('setoption name Threads value 2');     // игнорируется "-single", безопасно
    this.send('setoption name MultiPV value 1');     // по умолчанию одна линия
    this.multiPV = 1;
    if(this.modern)this.send('setoption name UCI_ShowWDL value true');
    await this.cmd('isready','readyok');
  }
  setMultiPV(n){ if(this.multiPV===n)return; this.multiPV=n; this.send('setoption name MultiPV value '+n); }
  reset(){if(this.w){try{this.w.terminate()}catch(_){}}this.w=null;this.waiter=null;this.search=null;this.main=false}
    async initWorker(urls,wasm,ms){
    // 1) JS-обёртка движка
    let txt=null;
    for(const u of urls){
      try{
        const buf = await getCachedFile(u, (r,t)=>reportEngineProgress('Движок (JS)', r, t));
        txt = new TextDecoder().decode(buf);
        break;
      }catch(e){ console.warn('JS fetch failed:', u, e); }
    }
    if(!txt) throw new Error('не удалось скачать движок');

    // 2) WASM (99 МБ для full) — через кэш + blob, чтобы воркер не ходил в сеть
    let wasmUrl = wasm || '';
    if(wasm){
      try{
        const wasmBuf = await getCachedFile(wasm, (r,t)=>reportEngineProgress('Движок (WASM)', r, t));
        wasmUrl = URL.createObjectURL(new Blob([wasmBuf], {type:'application/wasm'}));
        this._wasmBlobUrl = wasmUrl;
      }catch(e){
        console.warn('WASM cache failed, using direct URL:', e);
        wasmUrl = wasm;
      }
    }

    this.w=new Worker(URL.createObjectURL(new Blob([txt],{type:'application/javascript'}))+(wasmUrl?'#'+wasmUrl:''));
    this.w.onmessage=e=>this.onMsg(String(e.data));
    this.w.onerror=e=>console.error('Worker error',e);
    this.send=s=>this.w.postMessage(s);
    await this.handshake(ms);
  }
  async initMain(){
    let loaded=false;
    for(const u of SF_URLS){
      loaded=await new Promise(res=>{const s=document.createElement('script');s.src=u;s.onload=()=>res(true);s.onerror=()=>res(false);document.head.appendChild(s)});
      if(loaded&&(typeof STOCKFISH!=='undefined'||typeof Stockfish!=='undefined'))break;
      loaded=false;
    }
    if(!loaded)throw new Error('Stockfish.js не загрузился. Скачайте index.html и откройте его локально в браузере (двойным кликом).');
    let E=typeof STOCKFISH!=='undefined'?STOCKFISH:Stockfish;
    if(typeof E==='function')E=await Promise.resolve(E());
    const h=d=>this.onMsg(String(d&&d.data!==undefined?d.data:d));
    if(typeof E.addMessageListener==='function')E.addMessageListener(h);else E.onmessage=h;
    this.send=s=>E.postMessage(s);
    this.main=true;
    await this.handshake(10000);
  }
  async handshake(ms){
    await Promise.race([this.cmd('uci','uciok'),new Promise((_,rej)=>setTimeout(()=>rej(new Error('движок не отвечает')),ms))]);
  }
  cmd(s,wait){return new Promise(res=>{this.waiter={wait,res};this.send(s)})}
  onMsg(m){
    if(this.waiter&&m.startsWith(this.waiter.wait)){const w=this.waiter;this.waiter=null;w.res();return}
    if(this.search)this.search(m);
  }
  analyse(fen,depth,ms,onInfo,live){
    const run=()=>new Promise(res=>{
      const lines={},black=fen.split(' ')[1]==='b';let dmax=0;
      this.live=!!live;
      this.search=m=>{
        if(m.startsWith('info')&&m.includes(' pv ')){
          const s=m.match(/score (cp|mate) (-?\d+)/);if(!s||/bound/.test(m))return;
          const k=+((m.match(/multipv (\d+)/)||[0,1])[1]),dm=m.match(/ depth (\d+)/);
          if(dm)dmax=Math.max(dmax,+dm[1]);
          let v=+s[2];if(black)v=-v;
          const full=m.split(' pv ')[1].trim();
          lines[k]={type:s[1],v,pv:full.split(' ')[0],full};
          if(onInfo)onInfo(lines,dmax);
        }else if(m.startsWith('bestmove')){this.search=null;this.live=false;res({lines,best:m.split(' ')[1],depth:dmax})}
      };
      this.send('position fen '+fen);
      this.send('go depth '+depth+(ms?' movetime '+ms:''));
    });
    const p=(this.q||Promise.resolve()).then(run);
    this.q=p.catch(()=>{});
    return p;
  }
  stop(){if(this.search&&this.live&&!this.main)this.send('stop')}
}

/* ---------- Состояние ---------- */
let accs=[],liveTok=0,eng=null,runId=0,hist=[],fens=[],evals=[],cls=[],cur=0,flip=false,headers={};

/* ---------- Математика (Chess.com-совместимая) ---------- */
const MATE_CP = 10000;
const ACC_K   = 50;

const cpOf = l => l.type === 'mate' ? (l.v > 0 ? MATE_CP : -MATE_CP) : l.v;
const labelOf = l => l.type === 'mate'
  ? 'M' + Math.abs(l.v)
  : (l.v > 0 ? '+' : '') + (l.v / 100).toFixed(2);

function winPct(cp){
  if(cp >=  MATE_CP) return 100;
  if(cp <= -MATE_CP) return 0;
  const c = Math.max(-2000, Math.min(2000, cp));
  return 50 + 50 * (2 / (1 + Math.exp(-0.00361 * c)) - 1);
}

function material(c,color){
  let s=0;for(const row of c.board())for(const p of row)if(p)s+=(p.color===color?1:-1)*VAL[p.type];return s;
}
function uciToMove(u){return{from:u.slice(0,2),to:u.slice(2,4),promotion:u[4]}}
function sanOf(i,uci){
  if(!uci||uci==='(none)')return '—';
  const c=new Chess(fens[i]);const m=c.move(uciToMove(uci));return m?m.san:uci;
}

/* ---------- Оценка позиций ---------- */
async function evalPos(k,depth,ms){
  const c=new Chess(fens[k]);
  if(c.in_checkmate())return{cp:c.turn()==='w'?-MATE_CP:MATE_CP,label:'#',lines:{},best:null,term:true};
  if(c.game_over())return{cp:0,label:'0.00',lines:{},best:null,term:true};
  const r=await eng.analyse(fens[k],depth,ms);
  const l1=r.lines[1];
  if(!l1)return{cp:0,label:'0.00',lines:{},best:r.best};
  return{cp:cpOf(l1),label:labelOf(l1),lines:r.lines,best:r.best,d:r.depth};
}

/* ---------- Классификация хода (правила Chess.com) ---------- */

function isSacrifice(i){
  const mv = hist[i], mover = mv.color;
  if(VAL[mv.piece] < 3) return false;
  const c = new Chess(fens[i]);
  const m0 = material(c, mover);
  c.move(mv);
  const recaps = c.moves({verbose:true}).filter(m => m.to === mv.to && m.captured);
  if(!recaps.length) return false;
  let worst = material(c, mover);
  for(const r of recaps){
    const t = new Chess(c.fen()); t.move(r);
    worst = Math.min(worst, material(t, mover));
  }
  return m0 - worst >= 1;
}

function classify(i){
  const mv = hist[i], mover = mv.color, sg = mover === 'w' ? 1 : -1;
  const played = uciOf(mv), L = evals[i].lines || {};

  if(new Chess(fens[i]).moves().length === 1){ accs[i] = 100; return 'forced'; }

  const cpBefore = evals[i].cp * sg;
  let cpAfter = evals[i+1].cp * sg;
  for(const k in L) if(L[k].pv === played) cpAfter = cpOf(L[k]) * sg;

  const isBest = played === evals[i].best;
  if(isBest) cpAfter = Math.max(cpAfter, cpBefore);

  const cpLoss = Math.max(0, cpBefore - cpAfter);
  const loss   = cpLoss / 100;

  accs[i] = 100 * (1 - Math.tanh(cpLoss / ACC_K));

  if(isBest && loss <= 0.10 && isSacrifice(i)) return 'brilliant';
  if(i < 10 && cpLoss <= 10)                   return 'book';
  if(isBest)                                   return 'best';
  if(cpBefore > 200 && cpAfter < 50)           return 'blunder';
  if(loss <= 0.10)                             return 'excellent';
  if(loss <= 0.30)                             return 'good';
  if(loss <= 0.75)                             return 'inaccuracy';
  if(loss <= 1.50)                             return 'mistake';
  return 'blunder';
}

/* ---------- Текстовые пояснения ---------- */
const PN={p:'пешка',n:'конь',b:'слон',r:'ладья',q:'ферзь',k:'король'};
const PA={p:'пешку',n:'коня',b:'слона',r:'ладью',q:'ферзя',k:'короля'};
const PRON={p:'её',n:'его',b:'его',r:'её',q:'его',k:'его'};
const lc=s=>s?s[0].toLowerCase()+s.slice(1):s;
const flipFen=f=>{const p=f.split(' ');p[1]=p[1]==='w'?'b':'w';p[3]='-';return p.join(' ')};
const uciOf=m=>m.from+m.to+(m.promotion||'');
const moveOf=(fen,uci)=>{try{return new Chess(fen).move(uciToMove(uci))}catch(e){return null}};
const fmtCp=c=>Math.abs(c)>=MATE_CP?(c>0?'мат в вашу пользу':'мат против вас'):(c>0?'+':'')+(c/100).toFixed(1);
const evTxt=(l,sg)=>l?(l.type==='mate'?(l.v*sg>0?'мат в ':'мат против вас в ')+Math.abs(l.v):((l.v*sg>0?'+':'')+(l.v*sg/100).toFixed(1))):'';
const mateFor=(l,side)=>l&&l.type==='mate'&&((l.v>0)===(side==='w'))?Math.abs(l.v):0;

function swing(fen,full,side,n,base){
  try{
    const c=new Chess(fen),m0=material(new Chess(base||fen),side),mats=[];
    for(const u of full.split(' ').filter(Boolean).slice(0,n)){if(!c.move(uciToMove(u)))break;mats.push(material(c,side))}
    if(!mats.length)return null;
    let k=mats.length;if(k>1&&k%2)k--;
    return{d:mats[k-1]-m0};
  }catch(e){return null}
}
function bestThreat(fen,side,minGain){
  try{
    const c=new Chess(fen.split(' ')[1]===side?fen:flipFen(fen));let best=null;
    for(const m of c.moves({verbose:true})){
      if(!m.captured||m.captured==='k')continue;
      const g=new Chess(c.fen());g.move(m);
      const rec=g.moves({verbose:true}).some(x=>x.to===m.to&&x.captured);
      const gain=VAL[m.captured]-(rec?VAL[m.piece]:0);
      if(gain>=minGain&&(!best||gain>best.gain))best={m,gain,san:m.san};
    }
    return best;
  }catch(e){return null}
}
function forkOf(fen,sq){
  try{
    const c=new Chess(flipFen(fen)),out=[];
    for(const m of c.moves({verbose:true})){
      if(m.from!==sq||!m.captured||m.captured==='k'||VAL[m.captured]<3)continue;
      const g=new Chess(c.fen());g.move(m);
      const rec=g.moves({verbose:true}).some(x=>x.to===m.to&&x.captured);
      if(!rec||VAL[m.captured]>VAL[m.piece])out.push(m);
    }
    return out;
  }catch(e){return[]}
}

function whyMove(i,m,line){
  const fen=fens[i],side=m.color,opp=side==='w'?'b':'w',out=[];
  const g=new Chess(fen);g.move(m);const fenA=g.fen();
  if(m.san.includes('#'))return['Это мат — партия закончена.'];
  const mate=mateFor(line,side);
  if(mate)out.push(`Ведёт к форсированному мату в ${mate}: защититься соперник уже не может.`);
  const sw=line&&line.full?swing(fen,line.full,side,6):null;
  if(m.captured){
    out.push(sw&&sw.d>=2
      ?`Забирает ${PA[m.captured]}, и соперник не может отыграть материал (итог по линии: +${sw.d}).`
      :`Берёт ${PA[m.captured]} и упрощает позицию, сохраняя оценку.`);
  }
  const thrB=bestThreat(fen,opp,2);
  if(thrB){
    const thrA=bestThreat(fenA,opp,2);
    if(!thrA||(uciOf(thrA.m)!==uciOf(thrB.m)&&thrA.gain<thrB.gain))
      out.push(`Нейтрализует угрозу: иначе соперник сыграл бы ${thrB.san} и выиграл бы ${PA[thrB.m.captured]}.`);
  }
  const fk=forkOf(fenA,m.to);
  if(fk.length>=2)out.push(`Двойной удар: ${PN[m.piece]} на ${m.to} одновременно атакует ${fk.slice(0,3).map(x=>PA[x.captured]+' на '+x.to).join(', ')}.`);
  else{
    const tm=bestThreat(fenA,side,2);
    if(tm&&tm.m.from===m.to)out.push(`Создаёт угрозу ${tm.san}: под ударом оказывается ${PN[tm.m.captured]} на ${tm.m.to}.`);
  }
  if(m.san.includes('+'))out.push('Шах ограничивает выбор ответов и сохраняет за вами инициативу.');
  if(m.flags&&/[kq]/.test(m.flags))out.push('Рокировка уводит короля в безопасность и включает ладью в игру.');
  if(m.promotion)out.push('Пешка доходит до последней горизонтали и превращается в новую фигуру.');
  if(i<24&&(m.piece==='n'||m.piece==='b')&&m.from[1]===(side==='w'?'1':'8'))out.push(`Развивает ${PA[m.piece]} на активную позицию.`);
  if(i<24&&m.piece==='p'&&['d4','e4','d5','e5'].includes(m.to))out.push('Занимает центр пешкой и открывает линии для фигур.');
  if(!out.length){
    const x=(line?cpOf(line):evals[i+1].cp)*(side==='w'?1:-1);
    out.push(x>=150?'Сохраняет решающее преимущество.'
      :x<=-150?'Самая стойкая защита.'
      :Math.abs(x)<50?'Сохраняет равновесие.'
      :x>0?'Сохраняет перевес.'
      :'Держит позицию.');
  }
  return out.slice(0,2);
}

function whyBad(i,k){
  const mv=hist[i],side=mv.color,opp=side==='w'?'b':'w',sg=side==='w'?1:-1;
  const fenA=fens[i+1],e1=evals[i+1]||{},th=e1.best,thL=e1.lines&&e1.lines[1];
  const thm=th&&th!=='(none)'?moveOf(fenA,th):null;
  const sw=thm&&thL&&thL.full?swing(fenA,thL.full,opp,6):null,gain=sw?sw.d:0;
  const mate=mateFor(thL,opp);
  if(mate&&thm)return thm.san.includes('#')||mate===1
    ?`Теперь соперник ставит мат ходом ${thm.san}.`
    :`Теперь у соперника форсированный мат в ${mate} (начинается с ${thm.san}).`;
  if(thm&&thm.captured&&gain>=1){
    if(thm.to===mv.to)return `Вы поставили ${PA[mv.piece]} под бой: ${thm.san} забирает ${PRON[mv.piece]} (материал: −${gain}).`;
    return `Ход ослабил защиту: теперь ${thm.san} выигрывает ${PA[thm.captured]} (материал: −${gain}).`;
  }
  if(thm){
    const c=new Chess(fenA);c.move(thm);
    const fk=forkOf(c.fen(),thm.to);
    if(fk.length>=2)
      return `Соперник отвечает ${thm.san} с двойным ударом: ${PN[thm.piece]} атакует ${fk.slice(0,3).map(x=>PA[x.captured]).join(', ')}.`;
    if(gain>=1)return `Соперник отвечает ${thm.san} и выигрывает материал (материал: −${gain}).`;
  }
  const cpB=evals[i].cp*sg,cpA=evals[i+1].cp*sg;
  return `Оценка ухудшилась с ${fmtCp(cpB)} до ${fmtCp(cpA)}`+(thm?`, сильнейший ответ — ${thm.san}.`:'.');
}

function describeBest(i){
  const bu=evals[i].best;if(!bu||bu==='(none)')return'';
  const bm=moveOf(fens[i],bu);if(!bm)return'';
  const r=whyMove(i,bm,evals[i].lines[1])[0]||'';
  const sg=hist[i].color==='w'?1:-1;
  return `Лучше было ${bm.san}: ${lc(r).replace(/\.$/,'')} (оценка ${fmtCp(evals[i].cp*sg)}).`;
}

function whyBrilliant(i){
  const mv=hist[i],side=mv.color,sg=side==='w'?1:-1,l=evals[i+1]&&evals[i+1].lines&&evals[i+1].lines[1];
  const mate=mateFor(l,side);
  const sw=l&&l.full?swing(fens[i+1],l.full,side,8,fens[i]):null;
  let s=`Вы жертвуете ${PA[mv.piece]} на ${mv.to}`+(mv.captured?`, получая за ${PRON[mv.piece]} лишь ${PA[mv.captured]}`:'')+': ';
  s+=mate?`соперник может взять фигуру, но после этого форсированный мат в ${mate}`
    :sw&&sw.d>=3?`после взятия вы возвращаете материал с избытком (итог по линии: +${sw.d})`
    :`взамен вы получаете инициативу, которая стоит больше потерянного материала`;
  if(!mate)s+=` Оценка для вас: ${fmtCp(evals[i+1].cp*sg)}.`;
  return s;
}

function explainSmart(i,k){
  const mv=hist[i],L=evals[i].lines||{};
  const played=uciOf(mv),lineP=Object.values(L).find(x=>x.pv===played)||null;
  const best=sanOf(i,evals[i].best);
  switch(k){
    case'forced':return new Chess(fens[i]).in_check()
      ?'Единственный легальный ход: король под шахом.'
      :'Единственный легальный ход.';
    case'book':return 'Дебютный ход: '+lc(whyMove(i,mv,lineP)[0]);
    case'brilliant':return whyBrilliant(i);
    case'best':return whyMove(i,mv,lineP).join(' ');
    case'excellent':return whyMove(i,mv,lineP)[0]+' Оценка почти не изменилась.';
    case'good':return whyMove(i,mv,lineP)[0]+` Чуть точнее было ${best}.`;
    case'inaccuracy':case'mistake':case'blunder':return whyBad(i,k)+' '+describeBest(i);
  }
  return'';
}

function explain(i){
  const k=cls[i];if(!k)return'';
  try{const t=explainSmart(i,k);if(t)return t}catch(e){console.warn('explain:',e)}
  const best=sanOf(i,evals[i].best);
  return{
    forced:'Вынужденный ход.',
    book:'Дебютный ход.',
    brilliant:'Блестящая жертва: тактика рассчитана верно.',
    best:'Это первый выбор движка.',
    excellent:'Отличный ход, оценка почти не изменилась.',
    good:'Хороший ход, но есть чуть более точный вариант.',
    inaccuracy:`Неточность. Лучше было ${best}.`,
    mistake:`Ошибка. Лучше было ${best}.`,
    blunder:`Зевок. Лучше было ${best}.`
  }[k];
}

const pt=q=>{const f='abcdefgh'.indexOf(q[0]),r=8-+q[1];return[(flip?7-f:f)+.5,(flip?7-r:r)+.5]};
function arrow(from,to,col){

  const ux=(x2-x1)/len,uy=(y2-y1)/len,hl=.42,hw=.38,bx=x2-ux*hl,by=y2-uy*hl;

  `<polygon stroke="none" points="${x2-ux*.06},${y2-uy*.06} ${bx-uy*hw/2},${by+ux*hw/2} ${bx+uy*hw/2},${by-ux*hw/2}"/></g>`;

const circle=(q,col)=>{const[x,y]=pt(q);return`<circle cx="${x}" cy="${y}" r=".45" fill="none" stroke="${col}" stroke-width=".07" opacity=".85"/>`};

function pvSan(fen,full,n){

  return(ar+hm)/2;
}
const RT=[[30,200],[50,600],[65,1000],[75,1300],[85,1700],[92,2100],[97,2500],[100,2800]];
function ratingOf(a){for(let i=1;i<RT.length;i++)if(a<=RT[i][0]){const[x0,y0]=RT[i-1],[x1,y1]=RT[i];return Math.max(100,Math.round((y0+(a-x0)/(x1-x0)*(y1-y0))/50)*50)}return 2800}
function accHtml(){
  const card=(n,c)=>{const a=accOf(c);return a==null?'':`<div class="flex-1 bg-[#262522] rounded-lg p-3 text-center"><div class="text-xs text-neutral-400 truncate">${esc(n)}</div><div class="text-2xl font-extrabold" style="color:#81b64c">${a.toFixed(1)}%</div><div class="text-xs text-neutral-300">уровень ≈ ${ratingOf(a)}</div></div>`};
  return`<div class="flex gap-2 mb-3">${card(headers.White||'Белые','w')}${card(headers.Black||'Чёрные','b')}</div>`;
}
function renderSummary(){
  let h=accHtml()+'<div class="grid grid-cols-[1fr_48px_48px] gap-y-1.5 items-center"><span></span><span class="text-center text-neutral-400">Белые</span><span class="text-center text-neutral-400">Чёрные</span>';
  for(const k of Object.keys(B)){
    const n=c=>cls.filter((x,i)=>x===k&&hist[i].color===c).length;
    h+=`<span class="flex items-center gap-2">${badge(k,'sm')}${B[k].t}</span><span class="text-center font-bold">${n('w')}</span><span class="text-center font-bold">${n('b')}</span>`;
  }
  $('summary').innerHTML=h+'</div>';
}

/* ---------- Запуск анализа ---------- */
function showError(t){const e=$('err');e.textContent=t;e.classList.remove('hidden')}

$('mode').onchange = () => {
  const fast = $('mode').value === 'fast';
  $('tlim').classList.toggle('dim', fast);
};

function start(){
  $('err').classList.add('hidden');
  const text=$('pgn').value.trim();
  if(!text)return showError('Вставьте PGN партии в текстовое поле.');
  let g;
  try{g=new Chess();if(!g.load_pgn(text,{sloppy:true}))throw 0}
  catch(e){return showError('Не удалось разобрать PGN. Проверьте нотацию (например, 1. e4 e5 2. Nf3 Nc6).')}
  hist=g.history({verbose:true});
  if(!hist.length)return showError('В PGN не найдено ни одного хода.');
  headers=g.header();
  const c=headers.FEN?new Chess(headers.FEN):new Chess();
  fens=[c.fen()];
  for(const m of hist){if(!c.move(m))return showError('Ошибка при воспроизведении: ход '+m.san+' недопустим.');fens.push(c.fen())}
  evals=[];cls=[];accs=[];free=null;sel=null;cur=0;flip=false;
  $('names').textContent=`${headers.White||'Белые'} — ${headers.Black||'Чёрные'}${headers.Result?'  ('+headers.Result+')':''}`;
  $('summary').innerHTML='';$('prog').style.width='0';
  $('landing').classList.add('hidden');$('app').classList.remove('hidden');
  render();
  run($('mode').value, +$('tlim').value, $('engine').value);
}

async function run(mode, tl, kind){
  const id=++runId, st=$('status');
  try{
    if(eng&&eng.kind!==kind){eng.reset();eng=null}
    if(!eng){
      st.textContent = kind==='full'
        ? 'Загрузка Stockfish 19 (полная ≈99 МБ)…'
        : 'Загрузка Stockfish 19…';
      const e=new Engine(); await e.init(kind); eng=e;
    }
  }catch(e){ st.textContent='Ошибка движка: '+e.message; st.style.color='#ff8a85'; return }

  // Game analysis: MultiPV 1 достаточно и ≈3× быстрее.
  // cpAfter берётся из оценки следующей позиции (evals[i+1].cp), точность не теряется.
  eng.setMultiPV(1);

  const N = fens.length;
  const t0 = performance.now();

  // Пресеты
  let D, ms, openN = 0, fastMidMs = 0;
  const isFast = mode === 'fast';
  if(isFast){
    const budget = 8000;                                   // ≈8 с на весь разбор
    openN = N > 30 ? 20 : 0;
    fastMidMs = Math.max(50, Math.min(700, Math.round((budget - openN*25) / Math.max(1, N-openN))));
    D = 16; ms = 0;
  } else if(mode === 'deep'){
    D = 26;
    ms = tl > 0 ? tl*1000 : 8000;
  } else {
    D = 20;
    ms = tl > 0 ? tl*1000 : 2000;
  }
  if(eng.main){ D = Math.min(D, 16); ms = Math.min(ms || 2000, 2000); }

  for(let k=0;k<N;k++){
    if(id!==runId)return;
    await new Promise(r=>setTimeout(r,0));
    let kd = D, kms = ms;
    if(isFast){
      if(k < openN){ kd = eng.main ? 8 : 10; kms = 25; }
      else { kd = eng.main ? 12 : 16; kms = eng.main ? Math.min(fastMidMs,700) : fastMidMs; }
    }
    evals[k] = await evalPos(k, kd, kms);
    if(id!==runId)return;
    if(k>0) cls[k-1] = classify(k-1);
    $('prog').style.width = ((k+1)/N*100)+'%';
    st.textContent = `Анализ: ${k+1}/${N}, глубина ${evals[k].d||'—'} · ${eng.name}`;
    if(k===cur||k===cur+1||k===0) render(); else renderMoves();
  }
  st.textContent = `Готово за ${((performance.now()-t0)/1000).toFixed(1)} с · ${eng.name} · ${isFast ? 'быстрый' : 'глубина '+D}`;
  render(); renderSummary();
}

/* ---------- Звуки ---------- */
let AC=null,soundOn=true;
function tone(f,t0,d,type,g){const o=AC.createOscillator(),v=AC.createGain(),t=AC.currentTime+t0;o.type=type;o.frequency.value=f;v.gain.setValueAtTime(g,t);v.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(v);v.connect(AC.destination);o.start(t);o.stop(t+d)}
function noise(d,g){const n=Math.floor(AC.sampleRate*d),b=AC.createBuffer(1,n,AC.sampleRate),a=b.getChannelData(0);for(let i=0;i<n;i++)a[i]=(Math.random()*2-1)*(1-i/n);const s=AC.createBufferSource(),v=AC.createGain();v.gain.value=g;s.buffer=b;s.connect(v);v.connect(AC.destination);s.start()}
function sfx(m){
  if(!soundOn||!m)return;
  try{
    AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();
    if(m.san.includes('#'))[523,659,784].forEach((f,i)=>tone(f,i*.11,.45,'triangle',.18));
    else if(m.san.includes('+')){noise(.05,.3);tone(880,0,.1,'square',.06);tone(660,.1,.16,'square',.06)}
    else if(m.captured){noise(.09,.55);tone(140,0,.14,'triangle',.3)}
    else if(m.flags&&/[kq]/.test(m.flags)){noise(.04,.3);tone(300,0,.06,'triangle',.2);setTimeout(()=>{try{noise(.04,.3);tone(260,0,.07,'triangle',.2)}catch(e){}},120)}
    else{noise(.04,.25);tone(320,0,.06,'triangle',.18)}
  }catch(e){}
}

/* ---------- Навигация ---------- */
function animMove(from,to){
  const bd=$('board'),el=bd.querySelector(`[data-sq="${to}"] .pc, [data-sq="${to}"] .pcg`);if(!el)return;
  const a=pt(from),b=pt(to),s=bd.clientWidth/8;
  el.style.zIndex=9;
  el.animate([{transform:`translate(${(a[0]-b[0])*s}px,${(a[1]-b[1])*s}px)`},{transform:'none'}],{duration:170,easing:'ease-out'});
}
function go(n,noAnim){
  const old=cur;free=null;sel=null;liveTok++;marks={a:[],c:[]};if(eng)eng.stop();
  if(eggAudio)eggAudio.pause();
  cur=Math.max(0,Math.min(hist.length,n));render();
  if(!noAnim&&Math.abs(cur-old)===1){const m=hist[Math.max(cur,old)-1];cur>old?animMove(m.from,m.to):animMove(m.to,m.from)}
  if(soundOn&&cur>0&&cls[cur-1]==='brilliant'&&hist[cur-1].piece==='r'){
    if(window.speechSynthesis)speechSynthesis.cancel();
    try{eggAudio=eggAudio||new Audio(EGG_MP3);eggAudio.currentTime=0;eggAudio.play().catch(()=>{})}catch(e){}
    return;
  }
  if(cur>0)sfx(hist[cur-1]);
  speak();
}
let eggAudio=null;
let ap=null;
function stopAuto(){clearInterval(ap);ap=null;$('play').textContent='▶ Авто'}
function startAuto(){clearInterval(ap);$('play').textContent='⏸ Пауза';ap=setInterval(()=>{if(cur>=hist.length){stopAuto();return}go(cur+1)},+$('speed').value)}
$('play').onclick=()=>{if(ap){stopAuto();return}if(cur>=hist.length)go(0,true);startAuto()};
$('speed').onchange=()=>{if(ap)startAuto()};
$('snd').onchange=e=>{soundOn=e.target.checked};

document.addEventListener('keydown',e=>{
  if($('app').classList.contains('hidden')||['TEXTAREA','SELECT','INPUT'].includes(e.target.tagName))return;
  if(e.key==='ArrowLeft'){go(cur-1);e.preventDefault()}
  else if(e.key==='ArrowRight'){go(cur+1);e.preventDefault()}
  else if(e.key==='Home')go(0);else if(e.key==='End')go(hist.length);
});
$('moves').addEventListener('click',e=>{const b=e.target.closest('[data-ply]');if(b)go(+b.dataset.ply)});
document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{
  const a=b.dataset.nav;go(a==='start'?0:a==='end'?hist.length:a==='prev'?cur-1:cur+1)});
$('flip').onclick=()=>{flip=!flip;render()};
$('arr').onchange=e=>{showArrows=e.target.checked;render()};
$('voice').onchange=e=>{voiceOn=e.target.checked;speak()};

/* ---------- Доска ---------- */
const bd=$('board');let mk=null,dr=null;
function sqAt(e){
  const r=bd.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*8,y=(e.clientY-r.top)/r.height*8;
  if(x<0||y<0||x>=8||y>=8)return null;
  const f=Math.floor(x),rw=Math.floor(y);return'abcdefgh'[flip?7-f:f]+(8-(flip?7-rw:rw));
}
function tryMove(from,to,dropped){
  const g=free?free.g:new Chess(fens[cur]),m=g.move({from,to,promotion:'q'});
  sel=null;
  if(!m){render();return}
  if(!free)free={g};
  free.last=m;marks={a:[],c:[]};stopAuto();
  render();if(!dropped)animMove(from,to);
  sfx(m);startLive();
}
bd.addEventListener('contextmenu',e=>e.preventDefault());
bd.addEventListener('pointerdown',e=>{
  const q=sqAt(e);if(!q)return;
  if(e.button===2){mk={from:q,col:e.shiftKey?'#d6382f':e.ctrlKey?'#3b82f6':'#f5a623'};return}
  if(e.button!==0)return;
  marks={a:[],c:[]};
  const g=free?free.g:new Chess(fens[cur]);
  if(sel&&sel.moves.includes(q)){tryMove(sel.sq,q,false);return}
  const p=g.get(q);
  if(p&&p.color===g.turn()){
    sel={sq:q,moves:g.moves({square:q,verbose:true}).map(m=>m.to)};render();
    const orig=bd.querySelector(`[data-sq="${q}"] .pc, [data-sq="${q}"] .pcg`);
    if(orig){
      const s=bd.getBoundingClientRect().width/8,gh=orig.cloneNode(true);
      gh.style.cssText=`position:fixed;width:${s}px;height:${s}px;pointer-events:none;z-index:60;left:${e.clientX-s/2}px;top:${e.clientY-s/2}px;font-size:${s*.82}px;line-height:1;transform:none`;
      document.body.appendChild(gh);orig.style.opacity=.3;dr={from:q,gh,s};dragging=true;
    }
  }else{sel=null;render()}
});
document.addEventListener('pointermove',e=>{if(dr){dr.gh.style.left=e.clientX-dr.s/2+'px';dr.gh.style.top=e.clientY-dr.s/2+'px'}});
document.addEventListener('pointerup',e=>{
  if(e.button===2&&mk){
    const q=sqAt(e),m=mk;mk=null;if(!q)return;
    const circ=q===m.from,arr=circ?marks.c:marks.a,key=circ?{q,col:m.col}:{f:m.from,t:q,col:m.col};
    const i=arr.findIndex(x=>x.q===key.q&&x.f===key.f&&x.t===key.t&&x.col===key.col);
    i>=0?arr.splice(i,1):arr.push(key);render();return;
  }
  if(dr){
    const d=dr;dr=null;d.gh.remove();dragging=false;
    const q=sqAt(e);
    if(q&&q!==d.from&&sel&&sel.moves.includes(q))tryMove(d.from,q,true);else render();
  }
});

$('go').onclick=start;
$('back').onclick=()=>{runId++;stopAuto();liveTok++;free=null;if(window.speechSynthesis)speechSynthesis.cancel();$('app').classList.add('hidden');$('landing').classList.remove('hidden')};
$('sample').onclick=()=>{$('pgn').value='[Event "Opera Game"]\n[White "Paul Morphy"]\n[Black "Duke of Brunswick and Count Isouard"]\n[Result "1-0"]\n\n1. e4 e5 2. Nf3 d6 3. d4 Bg4 4. dxe5 Bxf3 5. Qxf3 dxe5 6. Bc4 Nf6 7. Qb3 Qe7 8. Nc3 c6 9. Bg5 b5 10. Nxb5 cxb5 11. Bxb5+ Nbd7 12. O-O-O Rd8 13. Rxd7 Rxd7 14. Rd1 Qe6 15. Bxd7+ Nxd7 16. Qb8+ Nxb8 17. Rd8# 1-0'};
new ResizeObserver(()=>{if(!$('app').classList.contains('hidden')&&fens.length)render()}).observe($('board'));
</script>
