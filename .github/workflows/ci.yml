name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chessmart_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d chessmart_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Validate opening book SAN
        run: npm run validate:openings
      - name: Validate Brilliant sacrifice classification
        run: npm run validate:brilliant-sacrifices
      - name: Validate all move classifications
        run: npm run validate:move-classification
      - name: Validate analysis core regressions
        run: npm run validate:analysis-core
      - name: Validate selective multi-engine review
        run: npm run validate:multi-engine
      - name: Validate recovery from first-position worker failures
        run: npm run validate:review-resilience
      - name: Validate cloud profile sync core
        run: npm run validate:profile-sync
      - name: Validate premoves and gameplay features
        run: npm run validate:gameplay
      - name: Validate Grandmaster 300 diagnostics
        run: npm run validate:diagnostics
      - name: Validate Stockfish diagnostic coach
        run: npm run validate:engine-coach
      - name: Validate Stockfish worker lifecycle and failure handling
        run: npm run validate:engine-worker
      - name: Validate endgame positions and five-position challenge
        run: npm run validate:endgames
      - name: Validate Puzzle Journey levels and scoring
        run: npm run validate:puzzle-journey
      - name: Validate Puzzle Rush difficulty progression
        run: npm run validate:puzzle-rush
      - name: Validate Training Academy and 15,000 scenarios
        run: npm run validate:training-academy
      - name: Validate CHESSMART Systems Hub and 15,000 scenarios
        run: npm run validate:systems-hub
      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Typecheck Supabase Edge Function
        run: deno check --node-modules-dir=auto --no-lock supabase/functions/game-action/index.ts supabase/functions/puzzle-battle/index.ts
      - name: Validate online SQL migrations and matchmaking
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: chessmart_test
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          bash scripts/validate-online-sql.sh
      - name: Smoke-test official Stockfish 19 WASM runtimes
        run: |
          set -euo pipefail
          STOCKFISH_DIR="$(mktemp -d)"
          trap 'rm -rf "$STOCKFISH_DIR"' EXIT
          cp public/engine/stockfish-19-lite.js "$STOCKFISH_DIR/stockfish-19-lite.js"
          cp public/engine/stockfish-19-lite-single.js "$STOCKFISH_DIR/stockfish-19-lite-single.js"
          RELEASE="https://github.com/nmrugg/stockfish.js/releases/download/v19.0.1"
          curl --fail --location --retry 3 "$RELEASE/stockfish-19-lite.wasm" --output "$STOCKFISH_DIR/stockfish-19-lite.wasm"
          curl --fail --location --retry 3 "$RELEASE/stockfish-19-lite-single.wasm" --output "$STOCKFISH_DIR/stockfish-19-lite-single.wasm"
          curl --fail --location --retry 3 "$RELEASE/stockfish-19-single.js" --output "$STOCKFISH_DIR/stockfish-19-single.js"
          curl --fail --location --retry 3 "$RELEASE/stockfish-19-single.wasm" --output "$STOCKFISH_DIR/stockfish-19-single.wasm"
          node scripts/validate-stockfish-runtime.mjs "$STOCKFISH_DIR"
          node scripts/validate-multi-engine-runtime.mjs "$STOCKFISH_DIR"
          node --experimental-strip-types --experimental-loader ./scripts/ts-extension-loader.mjs scripts/validate-morphy-stockfish.mjs "$STOCKFISH_DIR"
      - name: Production build
        run: npm run build
